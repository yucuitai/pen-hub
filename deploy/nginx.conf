server
{
    listen 80;
    server_name 118.190.107.1;
    index index.html;
    root /www/wwwroot/pen-hub/dist;

    # 前端静态文件 + Vue Router history 模式
    location / {
        root /www/wwwroot/pen-hub/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api {
        proxy_pass http://127.0.0.1:8567;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_set_header Connection "";
    }

    # SSE 流式推送配置
    location /api/article {
        proxy_pass http://127.0.0.1:8567;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        keepalive_timeout 86400s;
        chunked_transfer_encoding on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # 静态资源缓存
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log /www/wwwlogs/pen-hub.log;
    error_log /www/wwwlogs/pen-hub.error.log;
}
