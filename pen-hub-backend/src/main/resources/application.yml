spring:
  application:
    name: pen-hub-backend
  # 激活本地配置（敏感信息）
  profiles:
    active: local
  # mybatis-flex
  mybatis-flex:
    configuration:
      map-underscore-to-camel-case: false # 禁止将数据库中下划线命名映射为驼峰命名
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
server:
  port: 8567
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.pen.penhubbackend
# knife4j的增强配置，
knife4j:
  enable: true
  setting:
    language: zh_cn

# spring事务管理日志
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

