spring:
  application:
    name: pen-hub-backend
  # 激活本地配置（敏感信息）
  profiles:
    active: local
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
#  # MySQL 数据库配置
#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://localhost:3306/ai_passage_creator
#    username: root
#    password: 123456
#  # Redis 配置
#  data:
#    redis:
#      host: ${SPRING_DATA_REDIS_HOST}
#      port: 6379
#      database: 0
#      password:
server:
  port: 8567
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# mybatis-flex
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true # 将数据库中下划线命名映射为驼峰命名
# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.pen.penhubbackend
# knife4j的增强配置，
knife4j:
  enable: true
  setting:
    language: zh_cn

# spring事务管理日志
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
    com.pen.penhubbackend.mapper: debug

# 文章智能体配置
article:
  agent:
    orchestrator:
      # 是否启用多智能体编排模式（支持配图并行生成）
      # true: 使用 Spring AI Alibaba 多智能体编排
      # false: 使用原有的 ArticleAgentService
      enabled: true
    # Agent 最大迭代次数
    max-iterations: 10

