server:
  port: 8567
  servlet:
    context-path: /api

spring:
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/pen_hub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: pen_hub
    password: ${MYSQL_PASSWORD:123456}
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:123456!}

  # Spring AI Alibaba 配置
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-2eafcd4835694455b710402eafb7e92c}
    openai:
      api-key: ${OPENAI_API_KEY:sk-794615e0621549faac5d25d1f51c6959}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro

mybatis-flex:
  configuration:
    # 生成环境关闭日志
    log-impl: ""

# Pexels API 配置
pexels:
  api-key: ${PEXELS_API_KEY:zgIv9ZKMKIwMquQMifv1xvxNw4rBq7Qp4BaRQ9lWPlcQYRt4AqqPKZ6k}

# Nano Banana (Gemini 原生图片生成) 配置   网络问题本项目暂不使用
nano-banana:
  api-key: xxx
  model: gemini-3-pro-image-preview
  aspect-ratio: "16:9"
  image-size: "1K"
  output-mime-type: image/png

# Mermaid 图表生成配置
mermaid:
  cli-command: mmdc
  background-color: transparent
  output-format: svg
  width: 1200
  timeout: 30000

# Iconify 图标库配置
iconify:
  api-url: https://api.iconify.design
  search-limit: 10
  default-height: 64
  default-color: ""

# 表情包图片检索配置
emoji-pack:
  search-url: https://cn.bing.com/images/async
  suffix: 熊猫头表情包
  timeout: 10000

# SVG 概念示意图生成配置
svg-diagram:
  default-width: 800
  default-height: 600
  folder: svg-diagrams

# Stripe 支付配置（测试模式）
stripe:
  api-key: sk_test_your_stripe_secret_key
  webhook-secret: whsec_your_webhook_secret
  success-url: http://localhost:5173/vip?success=true
  cancel-url: http://localhost:5173/vip?cancelled=true

# 腾讯云 COS 配置（可选，MVP 阶段可以不配置）
tencent:
  cos:
    secret-id: your-secret-id
    secret-key: your-secret-key
    region: ap-guangzhou
    bucket: your-bucket

# FTP 上传配置
ftp:
  host: 127.0.0.1
  port: 21
  username: ${FTP_USERNAME:ftpuser}
  password: ${FTP_PASSWORD:284EL6TJhakbAZY2}
  passive-mode: true
  base-path: /
  base-url: http://118.190.107.1/images

# 文章智能体配置
article:
  agent:
    orchestrator:
      enabled: true
    max-iterations: 10